name: Wallapop Monitor Bot

on:
  schedule:
    # Esegue lo script ogni 5 minuti (il limite minimo consigliato su GitHub Actions)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permette di avviarlo manualmente da GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests cloudscraper beautifulsoup4

      - name: Esecuzione dello script Python
        run: python wallapop_bot.py

      - name: Salva e aggiorna seen_wallapop_items.json su GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_wallapop_items.json || true
          git diff-index --quiet HEAD || git commit -m "Chore: aggiornati articoli visti [skip ci]"
          git push
