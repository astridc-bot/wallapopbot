name: Wallapop Monitor Bot

on:
  schedule:
    # Esegue lo script ogni 15 minuti (puoi cambiare l'intervallo)
    - cron: '*/3 * * * *'
  workflow_dispatch: # Ti permette di avviarlo manualmente dalla scheda Actions

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configurazione di Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installazione dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esecuzione dello script Python
        run: python bot.py

      - name: Salva e aggiorna seen_items.json su GitHub
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add seen_items.json
          git diff-index --quiet HEAD || git commit -m "Chore: aggiornato visto articoli [skip ci]"
          git push
