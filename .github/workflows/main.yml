name: Wallapop Monitor

on:
  schedule:
    - cron: '*/10 * * * *'  # Esegue ogni 10 minuti
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa librerie
        run: |
          pip install requests

      - name: Esegui il Bot Wallapop
        run: |
          python bot.py        run: python bot.py

      - name: Salva la cronologia annunci aggiornata
        uses: actions/cache@v4
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}
