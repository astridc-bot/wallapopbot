name: Wallapop Monitor

on:
  schedule:
    # Esegue lo script automaticamente ogni 10 minuti
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permette anche l'avvio manuale

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica il codice dal repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Ripristina la cronologia annunci (Cache)
        uses: actions/cache@v4
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}
          restore-keys: |
            seen-items-

      - name: Installa dipendenze e Playwright
        run: |
          python -m pip install --upgrade pip
          pip install requests playwright
          playwright install chromium --with-deps

      - name: Esegui il Bot Wallapop
        run: python bot.py

      - name: Salva la cronologia annunci aggiornata
        uses: actions/cache@v4
        with:
          path: seen_items.json
          key: seen-items-${{ github.run_id }}
